name: Tag, build, test, and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  BIN: pin

jobs:
  resolve-version:
    name: Resolve and validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from Cargo.toml and validate
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          # Parse the package version from Cargo.toml (first `version = "X.Y.Z"`
          # under [package]).
          CARGO_VERSION=$(awk '
            /^\[package\]/ { in_pkg=1; next }
            /^\[/ { in_pkg=0 }
            in_pkg && /^version[[:space:]]*=/ {
              match($0, /"[^"]+"/)
              print substr($0, RSTART+1, RLENGTH-2)
              exit
            }
          ' Cargo.toml)

          if [[ ! "${CARGO_VERSION:-}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "::error::Could not parse a semver package version from Cargo.toml (got '${CARGO_VERSION:-}')"
            exit 1
          fi

          TAG="v${CARGO_VERSION}"
          echo "Cargo.toml package version: ${CARGO_VERSION} → tag ${TAG}"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            PUSHED_TAG="${{ github.ref_name }}"
            if [[ "${PUSHED_TAG}" != "${TAG}" ]]; then
              echo "::error::Pushed tag '${PUSHED_TAG}' does not match Cargo.toml version '${CARGO_VERSION}'. Either bump Cargo.toml to ${PUSHED_TAG#v} or push tag ${TAG} instead."
              exit 1
            fi
          else
            # workflow_dispatch: the tag must NOT already exist. This is the
            # "bump before release" guard — if Cargo.toml has not been bumped
            # since the previous release, this errors out.
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "::error::Tag ${TAG} already exists on origin. Bump the package version in Cargo.toml before triggering another release."
              exit 1
            fi
            if git rev-parse --verify --quiet "${TAG}" >/dev/null; then
              echo "::error::Tag ${TAG} already exists locally. Bump the package version in Cargo.toml before triggering another release."
              exit 1
            fi
          fi

          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-targets --all-features

  create-tag:
    name: Create release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [resolve-version, test]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

  build:
    name: Build ${{ matrix.target }}
    needs: [resolve-version, test, create-tag]
    if: |
      always() &&
      needs.test.result == 'success' &&
      (github.event_name == 'push' || needs.create-tag.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Use macos-latest for both Darwin targets. macos-13 Intel runners can sit
          # queued for a long time on GitHub-hosted Actions. Cross-building both
          # Apple targets on the current macOS image avoids the stuck-runner issue.
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-version.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          PKG="pin-${VERSION}-${TARGET}"
          mkdir -p "dist/${PKG}/bin" "dist/${PKG}/man/man1" "dist/${PKG}/docs"
          cp "target/${TARGET}/release/pin" "dist/${PKG}/bin/pin"
          cp "man/man1/pin.1" "dist/${PKG}/man/man1/pin.1"
          cp README.md BUILD.md LICENSE SPEC.md "dist/${PKG}/docs/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"
          shasum -a 256 "dist/${PKG}.tar.gz" > "dist/${PKG}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pin-${{ needs.resolve-version.outputs.version }}-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish GitHub release
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.build.result == 'success'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.tag }}
          name: Pin ${{ needs.resolve-version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.sha256

  bump-formula:
    name: Bump Homebrew formula
    needs: [resolve-version, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: |
      always() &&
      needs.release.result == 'success'
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Uses the workflow token. If branch protection on `main` requires
          # PRs, this push will fail — switch to opening a PR (e.g. via
          # peter-evans/create-pull-request) in that case.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rewrite formula tag(s)
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail

          updated=()
          for f in Formula/pin.rb packaging/homebrew/pin.rb; do
            if [[ -f "$f" ]]; then
              # Replace the v-prefixed semver inside `tag: "vX.Y.Z"`.
              sed -i -E "s|(tag:[[:space:]]*\")v[0-9]+\.[0-9]+\.[0-9]+(\")|\\1${TAG}\\2|" "$f"
              updated+=("$f")
            fi
          done

          if [[ ${#updated[@]} -eq 0 ]]; then
            echo "::warning::No formula files found to update."
            exit 0
          fi

          if git diff --quiet -- "${updated[@]}"; then
            echo "Formula already at ${TAG} — nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${updated[@]}"
          git commit -m "chore: bump Homebrew formula to ${TAG}"
          git push origin main
